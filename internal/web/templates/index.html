<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/fa.min.css">
    <meta name="theme-color" content="#1a1a1a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/pwa/icon-192.png">
    <link rel="stylesheet" href="/style.css">
    <script type="module" src="/components/version.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js');
            });
        }
    </script>
    <title>ExpenseOwl Dashboard</title>
    <script src="/chart.min.js"></script>
    <script type="module" src="/components/header.js"></script>
</head>
<body>
    <div class="container">
        <header-component></header-component>

        <!-- Input form (placed immediately below header) -->
        <div class="form-container">
            <form id="expenseForm" class="expense-form">
                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" required>
                    <script>
                        // Set today's date as default
                        const today = new Date();
                        const year = today.getFullYear();
                        const month = String(today.getMonth() + 1).padStart(2, '0'); // January is 0
                        const day = String(today.getDate()).padStart(2, '0');
                        const formattedDate = `${year}-${month}-${day}`;
                        document.getElementById('date').value = formattedDate;
                    </script>
                </div>

                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" placeholder="e.g., Taxi, Dinner" required>
                </div>
                
                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" required>
                        <option value="">categories</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="currency">Currency</label>
                    <select id="currency">
                        <option value="">-- choose --</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="currencyAmount">Currency Amount</label>
                    <input type="number" id="currencyAmount" step="0.01" min="0">
                </div>

                <div class="form-group">
                    <label for="amount">Amount (CAD)</label>
                    <input type="number" id="amount" step="0.01" min="0">
                    <div class="form-note">Automatically calculated from Currency unless you manually override</div>
                </div>

                <div class="form-group">
                    <label for="description">Description</label>
                    <input type="text" id="description" placeholder="Optional description">
                </div>
                <button type="submit" class="nav-button">Add Expense</button>
                <div id="formMessage" class="form-message"></div>
            </form>
            <div id="formMessage" class="form-message"></div>
        </div>

        <!-- Unified budget bars showing spent / budget per category -->
        <div class="budget-bars-container">
            <div id="budgetBars"></div>
        </div>

        <div id="cashflow-section" class="cashflow-container" style="display: none;">
            <div class="cashflow-item income">
                <div class="cashflow-label">Income</div>
                <div class="cashflow-value" id="cashflow-income"></div>
            </div>
            <div class="cashflow-item expenses">
                <div class="cashflow-label">Expenses</div>
                <div class="cashflow-value" id="cashflow-expenses"></div>
            </div>
            <div class="cashflow-item balance">
                <div class="cashflow-label">Balance</div>
                <div class="cashflow-value" id="cashflow-balance"></div>
            </div>
        </div>
    </div>
    <script>
        let currencySymbol = '$'; // Default to USD
        let startDate = 1;
        let pieChart = null;
        let currentDate = new Date();
        let allExpenses = [];
        let disabledCategories = new Set();
        let categoryColors = {};
        const colorPalette = [
            '#FF6B6B', '#4ECDC4', '#45B7D1', '#96CEB4', 
            '#FFBE0B', '#FF006E', '#8338EC', '#3A86FF', 
            '#FB5607', '#38B000', '#9B5DE5', '#F15BB5'
        ];
        // Form behavior
        let amountOverride = false;

        function populateCurrencySelect() {
            const sel = document.getElementById('currency');
            sel.innerHTML = '<option value="">-- choose --</option>';
            const codes = Object.keys(window.config.exchangeRates || {});
            codes.forEach(code => {
                const opt = document.createElement('option');
                opt.value = code;
                opt.textContent = code.toUpperCase();
                sel.appendChild(opt);
            });
            const last = localStorage.getItem('lastCurrency');
            if (last && codes.includes(last)) sel.value = last;
            else if (codes.length > 0) sel.value = codes[0];
        }

        function maybeComputeAmount() {
            if (amountOverride) return;
            const code = document.getElementById('currency').value;
            const cAmt = parseFloat(document.getElementById('currencyAmount').value) || 0;
            if (code && cAmt > 0 && window.config.exchangeRates && window.config.exchangeRates[code]) {
                const rate = window.config.exchangeRates[code];
                document.getElementById('amount').value = (cAmt * rate).toFixed(2);
            } else {
                document.getElementById('amount').value = '';
            }
        }

        document.addEventListener('click', () => {
            // Global click to reset amount override if user clears amount input
            const amt = document.getElementById('amount').value;
            if (!amt) amountOverride = false;
        });

        // Listen for settings updates from other tabs and update dashboard live
        window.addEventListener('storage', (e) => {
            if (e.key === 'budgetsUpdated' || e.key === 'exchangeRatesUpdated' || e.key === 'categoriesUpdated') {
                fetch('/categories').then(r => r.json()).then(cfg => {
                    window.config = cfg;
                    // refresh category select and currency options
                    const categorySelect = document.getElementById('category');
                    categorySelect.innerHTML = cfg.categories.map(cat => `<option value="${cat}">${cat}</option>`).join('');
                    // Set to last used category if available
                    const lastCat = localStorage.getItem('lastCategory');
                    if (lastCat && cfg.categories.includes(lastCat)) {
                        categorySelect.value = lastCat;
                    } else if (cfg.categories.length > 0) {
                        categorySelect.value = cfg.categories[0];
                    }
                    populateCurrencySelect();
                    renderBudgetBars();
                }).catch(err => console.error('Failed to auto-refresh config:', err));
            }
        });
        function assignCategoryColors(categories) {
            categories.forEach((category, index) => {
                if (!categoryColors[category]) {
                    categoryColors[category] = colorPalette[index % colorPalette.length];
                }
            });
        }

        function formatCurrency(amount) {
            let formattedAmount = new Intl.NumberFormat('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2}).format(amount);
            // Currencies commonly used after the amount
            const postfixCurrencies = new Set(['kr', 'kr.', 'Fr', 'zł']);
            if (postfixCurrencies.has(currencySymbol)) {
                return `${formattedAmount} ${currencySymbol}`;
            }
            return `${currencySymbol} ${formattedAmount}`;
        }

        function calculateCategoryBreakdown(expenses) {
            const categoryTotals = {};
            let totalAmount = 0;
            expenses.forEach(exp => {
                if (exp.category !== "Income" && !disabledCategories.has(exp.category)) {
                    categoryTotals[exp.category] = (categoryTotals[exp.category] || 0) + exp.amount;
                    totalAmount += exp.amount;
                }
            });
            return Object.entries(categoryTotals)
                .map(([category, total]) => ({
                    category,
                    total,
                    percentage: (total / totalAmount) * 100
                }))
                .sort((a, b) => b.total - a.total);
        }

        function calculateIncome(expenses) {
            return expenses.filter(exp => exp.category === "Income").reduce((sum, exp) => sum + exp.amount, 0);
        }

        function calculateExpenses(expenses) {
            return expenses.filter(exp => exp.category !== "Income").reduce((sum, exp) => sum + exp.amount, 0);
        }

        // New: render budget bars for the current month and respect toggled categories
        function renderBudgetBars() {
            const container = document.getElementById('budgetBars');
            container.innerHTML = '';

            // Use only current-month expenses for the dashboard visualization
            const monthExpenses = getMonthExpenses(allExpenses)
                .filter(exp => exp.category !== 'Income' && !disabledCategories.has(exp.category));

            // Sum spent amounts across the filtered expenses
            const totals = {};
            monthExpenses.forEach(exp => {
                totals[exp.category] = (totals[exp.category] || 0) + exp.amount;
            });

            // Ensure we render one row per configured category (preserve order)
            const cfgCats = (window.config && window.config.categories) ? window.config.categories : [];
            const budgets = (window.config && window.config.budgets) ? window.config.budgets : {};

            // Make sure colors are assigned for every configured category
            assignCategoryColors(cfgCats);

            // --- TOTAL BAR ---
            const totalSpent = cfgCats.reduce((sum, cat) => sum + (totals[cat] || 0), 0);
            const totalBudget = cfgCats.reduce((sum, cat) => sum + (budgets[cat] || 0), 0);
            const totalOver = Math.max(totalSpent - totalBudget, 0);
            const totalSpentPct = totalBudget > 0 ? Math.min((totalSpent / totalBudget) * 100, 100) : (totalSpent > 0 ? 100 : 0);
            const totalBar = document.createElement('div');
            if (totalOver > 0) {
                totalBar.className = 'budget-category budget-warning';
                totalBar.innerHTML = `
                    <div class="budget-row top-row">
                        <div class="label">Total</div>
                        <div class="values">${formatCurrency(totalSpent)} / ${formatCurrency(totalBudget)}</div>
                    </div>
                    <div class="budget-row bar-row">
                        <div class="bar-outer">
                            <div class="bar-spent full-red" style="width:100%;">Over by: ${formatCurrency(totalOver)}</div>
                        </div>
                    </div>
                `;
            } else {
                totalBar.className = 'budget-category' + (totalBudget === 0 ? ' budget-empty' : '');
                totalBar.innerHTML = `
                    <div class="budget-row top-row">
                        <div class="label">Total</div>
                        <div class="values">${formatCurrency(totalSpent)} / ${formatCurrency(totalBudget)}</div>
                    </div>
                    <div class="budget-row bar-row">
                        <div class="bar-outer">
                            <div class="bar-spent" style="width: ${totalSpentPct}%; background: linear-gradient(90deg,#4EC9F1,#4ecdc4);"></div>
                        </div>
                    </div>
                `;
            }
            container.appendChild(totalBar);

            // --- CATEGORY BARS ---
            cfgCats.forEach(category => {
                const spent = totals[category] || 0;
                const budget = budgets[category] || 0;
                const left = Math.max(budget - spent, 0);
                const over = Math.max(spent - budget, 0);
                const spentPct = budget > 0 ? Math.min((spent / budget) * 100, 100) : (spent > 0 ? 100 : 0);
                const color = categoryColors[category] || '#45B7D1';

                const item = document.createElement('div');
                if (over > 0) {
                    // Fully red bar with centered white text indicating how much over the budget
                    item.className = 'budget-category budget-warning';
                    item.innerHTML = `
                        <div class="budget-row top-row">
                            <div class="label"><a class="budget-link" href="/table?category=${encodeURIComponent(category)}" onclick="try{localStorage.setItem('lastCategory','${category}')}catch(e){}">${category}</a></div>
                            <div class="values">${formatCurrency(spent)} / ${formatCurrency(budget)}</div>
                        </div>
                        <div class="budget-row bar-row">
                            <div class="bar-outer">
                                <div class="bar-spent full-red" style="width:100%;">Over by: ${formatCurrency(over)}</div>
                            </div>
                        </div>
                    `;
                } else {
                    item.className = 'budget-category' + (budget === 0 ? ' budget-empty' : '');
                    item.innerHTML = `
                        <div class="budget-row top-row">
                            <div class="label"><a class="budget-link" href="/table?category=${encodeURIComponent(category)}" onclick="try{localStorage.setItem('lastCategory','${category}')}catch(e){}">${category}</a></div>
                            <div class="values">${formatCurrency(spent)} / ${formatCurrency(budget)}</div>
                        </div>
                        <div class="budget-row bar-row">
                            <div class="bar-outer">
                                <div class="bar-spent" style="width: ${spentPct}%; background: linear-gradient(90deg,#4EC9F1,#4ecdc4);"></div>
                            </div>
                        </div>
                    `;
                }
                container.appendChild(item);
            });
            updateCashflow(allExpenses);
        }

        function updateCashflow(expenses) {
            const income = calculateIncome(expenses);
            const expenseTotal = calculateExpenses(expenses);
            const balance = income - expenseTotal;
            const cashflowSection = document.getElementById('cashflow-section');
            if (income > 0) {
                document.getElementById('cashflow-income').textContent = formatCurrency(income);
                document.getElementById('cashflow-expenses').textContent = formatCurrency(expenseTotal);
                document.getElementById('cashflow-balance').textContent = formatCurrency(balance);
                const balanceElement = document.getElementById('cashflow-balance');
                if (balance >= 0) {
                    balanceElement.classList.add('positive');
                    balanceElement.classList.remove('negative');
                } else {
                    balanceElement.classList.add('negative');
                    balanceElement.classList.remove('positive');
                }
                cashflowSection.style.display = 'flex';
            } else {
                cashflowSection.style.display = 'none';
            }
        }

        function createPieChart(categoryData) {
            if (pieChart) pieChart.destroy();
            pieChart = new Chart('categoryPieChart', {
                type: 'doughnut',
                data: {
                    labels: categoryData.map(c => c.category),
                    datasets: [{
                        data: categoryData.map(c => c.total),
                        backgroundColor: categoryData.map(c => categoryColors[c.category]),
                        borderColor: '#1a1a1a',
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        },
                        tooltip: {
                            callbacks: {
                                label: (context) => {
                                    const value = context.raw;
                                    const total = context.dataset.data.reduce((sum, val) => sum + val, 0);
                                    const percentage = ((value / total) * 100).toFixed(1);
                                    return `${context.label}: ${formatCurrency(value)} (${percentage}%)`;
                                }
                            }
                        }
                    }
                }
            });
        }

        function updateLegend(categoryData) {
            const legendContainer = document.getElementById('customLegend');
            if (!legendContainer) return; // Legend removed from layout, skip updating it
            legendContainer.innerHTML = ''; // Clear previous legend
            // Get unique categories from current month's expenses only
            const monthExpenses = getMonthExpenses(allExpenses);
            const currentMonthCategories = [...new Set(monthExpenses
                .filter(exp => exp.category !== "Income") // Exclude Income from legend
                .map(exp => exp.category))];

            // Include configured categories so categories with no spending this month still appear
            const cfgCats = (window.config && window.config.categories) ? window.config.categories : [];
            const allCategories = [...new Set([...cfgCats, ...currentMonthCategories])];

            // Create a map of active category data for easy lookup
            const categoryMap = new Map(categoryData.map(cat => [cat.category, cat]));
            const budgets = (window.config && window.config.budgets) ? window.config.budgets : {};
            
            allCategories.sort((a, b) => {
                const dataA = categoryMap.get(a);
                const dataB = categoryMap.get(b);
                if (dataA && dataB) return dataB.total - dataA.total;
                if (dataA) return -1;
                if (dataB) return 1;
                return a.localeCompare(b);
            }).forEach(category => {
                const item = document.createElement('div');
                item.className = `legend-item${disabledCategories.has(category) ? ' disabled' : ''}`;
                const color = categoryColors[category];
                const categoryData = categoryMap.get(category);
                const percentage = categoryData ? ` (${categoryData.percentage.toFixed(1)}%)` : '';
                const amount = categoryData ? formatCurrency(categoryData.total) : '';
                const hasBudget = budgets[category] && budgets[category] > 0;
                const badgeHtml = hasBudget ? '' : `<span class="no-budget-badge">No budget set</span>`;
                item.innerHTML = `
                    <div class="color-box" style="background-color: ${color}"></div>
                    <div class="legend-text">
                        <span>${category}${percentage} ${badgeHtml}</span>
                        <span class="amount">${amount}</span>
                    </div>
                `;
                item.addEventListener('click', () => toggleCategory(category));
                legendContainer.appendChild(item);
            });

            // Calculate total of only the enabled categories
            const activeTotalExpenses = monthExpenses
                .filter(exp => exp.category !== "Income" && !disabledCategories.has(exp.category))
                .reduce((sum, exp) => sum + exp.amount, 0);

            // Add totals section
            const totalsHtml = `
                <div style="margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--border);">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <span>Total:</span>
                        <span class="amount">
                            ${formatCurrency(activeTotalExpenses)}
                        </span>
                    </div>
                </div>
            `;
            legendContainer.insertAdjacentHTML('beforeend', totalsHtml);
        }

        function toggleCategory(category) {
            if (disabledCategories.has(category)) {
                disabledCategories.delete(category);
            } else {
                disabledCategories.add(category);
            }
            updateChartAndLegend();
        }

        // Update both the budget bars and the legend (and pie chart if present)
        function updateChartAndLegend() {
            // Use current-month data, respecting disabled categories
            const monthExpenses = getMonthExpenses(allExpenses).filter(exp => !disabledCategories.has(exp.category));
            const categoryData = calculateCategoryBreakdown(monthExpenses);

            // Ensure colors exist for configured categories
            const cfgCats = (window.config && window.config.categories) ? window.config.categories : [];
            assignCategoryColors(cfgCats);

            // Update legend and visualizations
            updateLegend(categoryData);
            // If the old pie chart is still used, keep it updated for compatibility
            if (typeof createPieChart === 'function') {
                createPieChart(categoryData);
            }
            // Render the budget bars from the current month perspective
            renderBudgetBars();
        }

        async function initialize() {
            try {
                // Fetch config response
                const configResponse = await fetch('/categories');
                if (!configResponse.ok) throw new Error('Failed to fetch configuration');
                const cfg = await configResponse.json();
                // store global config object for later use in rendering
                window.config = cfg;
                const categorySelect = document.getElementById('category');
                categorySelect.innerHTML = cfg.categories.map(cat => 
                    `<option value="${cat}">${cat}</option>`
                ).join('');
                // Set to last used category if available
                const lastCat = localStorage.getItem('lastCategory');
                if (lastCat && cfg.categories.includes(lastCat)) {
                    categorySelect.value = lastCat;
                } else if (cfg.categories.length > 0) {
                    categorySelect.value = cfg.categories[0];
                }
                currencySymbol = cfg.currency;
                startDate = cfg.startDate;
                // Populate currencies dropdown from configured exchange rates
                populateCurrencySelect();
                // Attach form auto-calc listeners
                document.getElementById('currency').addEventListener('change', () => { amountOverride = false; maybeComputeAmount(); });
                document.getElementById('currencyAmount').addEventListener('input', () => { maybeComputeAmount(); });
                document.getElementById('amount').addEventListener('input', () => { amountOverride = true; });
                // Fetch expenses
                const response = await fetch('/expenses');
                if (!response.ok) throw new Error('Failed to fetch data');
                allExpenses = await response.json();
                // Get unique categories and assign colors
                const uniqueCategories = [...new Set(allExpenses.map(exp => exp.category))];
                assignCategoryColors(uniqueCategories);
                // Render budget bar overview (across all data)
                renderBudgetBars();
            } catch (error) {
                console.error('Failed to initialize dashboard:', error);
            }
        }

        Chart.defaults.color = '#b3b3b3';
        Chart.defaults.borderColor = '#606060';
        Chart.defaults.font.family = '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
        
        // Helpers
        function formatMonth(date) {
            return date.toLocaleDateString('en-US', { 
                year: 'numeric',
                month: 'long',
                timeZone: getUserTimeZone()
            });
        }
        function getISODateWithLocalTime(dateInput) {
            const [year, month, day] = dateInput.split('-').map(Number);
            const now = new Date();
            const hours = now.getHours();
            const minutes = now.getMinutes();
            const seconds = now.getSeconds();
            const localDateTime = new Date(year, month - 1, day, hours, minutes, seconds);
            return localDateTime.toISOString();
        }
        function getUserTimeZone() {
            return Intl.DateTimeFormat().resolvedOptions().timeZone;
        }

        // Update month display and navigation buttons
        function updateMonthDisplay() {
            document.getElementById('currentMonth').textContent = formatMonth(currentDate);
            const now = new Date();
            const isCurrentMonth = currentDate.getMonth() === now.getMonth() && currentDate.getFullYear() === now.getFullYear();
            document.getElementById('nextMonth').disabled = isCurrentMonth;
        }
        // Get start and end of month
        function getMonthBounds(date) {
            const localDate = new Date(date);
            // If startDate is 1, return generic month bounds
            if (startDate === 1) {
                const startLocal = new Date(localDate.getFullYear(), localDate.getMonth(), 1);
                const endLocal = new Date(localDate.getFullYear(), localDate.getMonth() + 1, 0, 23, 59, 59, 999);
                const start = new Date(startLocal.toISOString());
                const end = new Date(endLocal.toISOString());
                return { start, end };
            }
            // If startDate is not 1, need to account for variations in month length
            let thisMonthStartDate = startDate;
            let prevMonthStartDate = startDate;
            let nextMonthStartDate = startDate;
            // Adjust for variations in current, previous and next months
            const currentMonth = localDate.getMonth();
            const currentYear = localDate.getFullYear();
            const daysInCurrentMonth = new Date(currentYear, currentMonth + 1, 0).getDate(); // last day of current month
            thisMonthStartDate = Math.min(thisMonthStartDate, daysInCurrentMonth);
            const prevMonth = currentMonth === 0 ? 11 : currentMonth - 1;
            const prevYear = currentMonth === 0 ? currentYear - 1 : currentYear;
            const daysInPrevMonth = new Date(prevYear, prevMonth + 1, 0).getDate();
            prevMonthStartDate = Math.min(prevMonthStartDate, daysInPrevMonth);
            const nextMonth = currentMonth === 11 ? 0 : currentMonth + 1;
            const nextYear = currentMonth === 11 ? currentYear + 1 : currentYear;
            const daysInNextMonth = new Date(nextYear, nextMonth + 1, 0).getDate();
            nextMonthStartDate = Math.min(nextMonthStartDate, daysInNextMonth);
            
            // Return bounds for current period or the previous period
            if (localDate.getDate() < thisMonthStartDate) {
                const startLocal = new Date(prevYear, prevMonth, prevMonthStartDate);
                const endLocal = new Date(currentYear, currentMonth, thisMonthStartDate - 1, 23, 59, 59, 999);
                const start = new Date(startLocal.toISOString());
                const end = new Date(endLocal.toISOString());
                return { start, end };
            } else {
                const startLocal = new Date(currentYear, currentMonth, thisMonthStartDate);
                const endLocal = new Date(nextYear, nextMonth, nextMonthStartDate - 1, 23, 59, 59, 999);
                const start = new Date(startLocal.toISOString());
                const end = new Date(endLocal.toISOString());
                return { start, end };
            }
        }
        // Filter expenses for current month
        function getMonthExpenses(expenses) {
            const { start, end } = getMonthBounds(currentDate);
            return expenses.filter(exp => {
                const expDate = new Date(exp.date);
                return expDate >= start && expDate <= end;
            }).sort((a, b) => new Date(b.date) - new Date(a.date));
        }
        function showNoDataMessage() {
            if (pieChart) {
                pieChart.destroy();
                pieChart = null;
            }
            const chartCanvas = document.getElementById('categoryPieChart');
            const ctx = chartCanvas.getContext('2d');
            ctx.clearRect(0, 0, chartCanvas.width, chartCanvas.height);
            const legendContainer = document.getElementById('customLegend');
            if (legendContainer) legendContainer.innerHTML = '<div class="no-data">No expenses recorded for this month</div>';
        }

        document.getElementById('expenseForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = {
                name: document.getElementById('name').value,
                category: document.getElementById('category').value,
                amount: parseFloat(document.getElementById('amount').value) || 0,
                currency: document.getElementById('currency').value.trim().toLowerCase(),
                currencyAmount: parseFloat(document.getElementById('currencyAmount').value) || 0,
                date: getISODateWithLocalTime(document.getElementById('date').value),
                description: document.getElementById('description').value
            };
            try {
                // store last used currency and category on the device
                try { localStorage.setItem('lastCurrency', formData.currency || ''); } catch(e) {}
                try { localStorage.setItem('lastCategory', formData.category || ''); } catch(e) {}
                const response = await fetch('/expense', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData)
                });
                const messageDiv = document.getElementById('formMessage');
                if (response.ok) {
                    messageDiv.textContent = 'Expense added successfully!';
                    messageDiv.className = 'form-message success';
                    document.getElementById('expenseForm').reset();
                    // reset override state so auto-calculation resumes
                    amountOverride = false;
                    await initialize();
                    const today = new Date();
                    const year = today.getFullYear();
                    const month = String(today.getMonth() + 1).padStart(2, '0');
                    const day = String(today.getDate()).padStart(2, '0');
                    document.getElementById('date').value = `${year}-${month}-${day}`;
                } else {
                    const error = await response.json();
                    messageDiv.textContent = `Error: ${error.error || 'Failed to add expense'}`;
                    messageDiv.className = 'form-message error';
                }
                // Clear message after 3 seconds
                setTimeout(() => {
                    messageDiv.textContent = '';
                    messageDiv.className = 'form-message';
                }, 3000);
            } catch (error) {
                console.error('Error adding expense:', error);
                const messageDiv = document.getElementById('formMessage');
                messageDiv.textContent = 'Error: Failed to add expense';
                messageDiv.className = 'form-message error';
            }
        });
        document.addEventListener('DOMContentLoaded', initialize);
    </script>
</body>
</html>
