<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/fa.min.css">
    <link rel="stylesheet" href="/style.css">
    <title>ExpenseOwl Settings</title>
</head>
<body>
    <div class="container">
        <header>
            <!-- <h1 align="center">ExpenseOwl</h1> -->
            <div class="nav-bar">
                <a href="/">
                    <img src="/pwa/icon-512.png" alt="ExpenseOwl Logo" height="85" style="vertical-align: middle; margin-right: 20px;">
                </a>
                <a href="/" class="view-button" data-tooltip="Dashboard">
                    <i class="fa-solid fa-chart-pie"></i>
                </a>
                <a href="/table" class="view-button" data-tooltip="Table View">
                    <i class="fa-solid fa-table"></i>
                </a>
                <a href="/settings" class="view-button active" data-tooltip="Settings">
                    <i class="fa-solid fa-gear"></i>
                </a>
            </div>
        </header>

        <!-- Categories Section -->
        <div class="form-container">
            <h2 align="center">Category Settings</h2>
            <div id="categories-manager">
                <div id="categories-list" class="categories-list">
                    <!-- Categories will be populated here -->
                </div>
                <div class="category-input-container">
                    <input type="text" id="newCategory" placeholder="Add new category">
                    <button id="addCategory" class="nav-button">Add</button>
                </div>
                <button id="saveCategories" class="nav-button">Save Categories</button>
                <div id="categoriesMessage" class="form-message"></div>

                <!-- Delete / Reassign Modal -->
                <div id="deleteCategoryModal" class="modal">
                    <div class="modal-content">
                        <h3>Reassign Category</h3>
                        <p>Choose a category to move all transactions from <strong id="oldCategoryName"></strong> to:</p>
                        <select id="reassignSelect"></select>
                        <div style="margin-top:1rem; display:flex; gap:1rem; justify-content:flex-end;">
                            <button class="modal-button" onclick="closeDeleteCategoryModal()">Cancel</button>
                            <button class="modal-button confirm" id="confirmReassign">Reassign & Delete</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="settings-container">
            <!-- Currency Section -->
            <div class="form-container half-width">
                <h2 align="center">Currency Settings</h2>
                <div class="currency-selector">
                    <select id="currencySelect">
                        <!-- Currencies will be populated here -->
                    </select>
                    <button id="saveCurrency" class="nav-button">Save</button>
                </div>
                <div id="currencyMessage" class="form-message"></div>
            </div>
            

        </div>

        <!-- Budget Settings -->
        <div class="form-container">
            <h2 align="center">Budget Settings</h2>
            <div id="budget-list" class="budget-list">
                <!-- Budget inputs populated here -->
            </div>
            <button id="saveBudgets" class="nav-button">Save Budgets</button>
            <div id="budgetsMessage" class="form-message"></div>
        </div>

        <!-- Exchange Rate Settings -->
        <div class="form-container">
            <h2 align="center">Exchange Rates (to CAD)</h2>
            <div id="exchange-rates-list" class="exchange-list">
                <!-- Rates will be populated here -->
            </div>
            <div class="add-exchange">
                <input type="text" id="newExchangeCode" placeholder="Currency code (e.g., jpy)">
                <input type="number" id="newExchangeRate" placeholder="Rate to CAD" step="0.0001">
                <button id="addExchange" class="nav-button">Add</button>
            </div>
            <button id="saveExchangeRates" class="nav-button">Save Rates</button>
            <div id="exchangeMessage" class="form-message"></div>
        </div>

        <!-- Import/Export Section -->
        <div class="form-container">
            <h2 align="center">Import/Export Data</h2>
            <div class="export-buttons">
                <a href="/export/csv" class="nav-button" download="expenses.csv">
                    <i class="fa-solid fa-file-csv"></i> Export CSV
                </a>
                <a href="/export/json" class="nav-button" download="expenses.json">
                    <i class="fa-solid fa-file-code"></i> Export JSON
                </a>
                <label for="csvFile" class="nav-button">
                    <i class="fa-solid fa-file-csv"></i> Import CSV
                </label>
                <input type="file" id="csvFile" accept=".csv" style="display: none;">
                <label for="jsonFile" class="nav-button">
                    <i class="fa-solid fa-file-code"></i> Import JSON
                </label>
                <input type="file" id="jsonFile" accept=".json" style="display: none;">
            </div>
            <div id="importMessage" class="form-message"></div>
            <div id="importSummary" class="import-summary" style="display: none;"></div>
        </div>
    </div>

    <script>
        const currencySymbols = {
            "cad": "C$",   // Canadian Dollar
            "usd": "$",    // US Dollar
        };

        let categories = [];
        let currentCurrency = "";
        let currentStartDate = 1;
        let budgets = {};
        let exchangeRates = {};
        let draggedItem = null;

        // Functions to show message
        function showMessage(elementId, message, isSuccess) {
            const messageDiv = document.getElementById(elementId);
            messageDiv.textContent = message;
            messageDiv.className = isSuccess ? 'form-message success' : 'form-message error';
            setTimeout(() => {
                messageDiv.textContent = '';
                messageDiv.className = 'form-message';
            }, 3000);
        }

        // Category functions
        function renderCategories() {
            const list = document.getElementById('categories-list');
            list.innerHTML = '';
            categories.forEach((category, index) => {
                const item = document.createElement('div');
                item.className = 'category-item';
                item.draggable = true;
                item.dataset.index = index;
                item.innerHTML = `
                    <div class="category-handle-area">
                        <span class="drag-handle"><i class="fa-solid fa-grip-lines"></i></span>
                        <span>${category}</span>
                    </div>
                    <button class="delete-button" onclick="removeCategory(${index})">
                        <i class="fa-solid fa-times"></i>
                    </button>
                `;
                
                // Add drag event listeners
                item.addEventListener('dragstart', handleDragStart);
                item.addEventListener('dragover', handleDragOver);
                item.addEventListener('dragleave', handleDragLeave);
                item.addEventListener('dragend', handleDragEnd);
                item.addEventListener('drop', handleDrop);
                
                list.appendChild(item);
            });
        }

        // Drag and drop handlers
        function handleDragStart(e) {
            this.classList.add('dragging');
            draggedItem = this;
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/html', this.innerHTML);
            removePlaceholders();
        }

        function handleDragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            this.classList.add('drag-over');
            if (this === draggedItem) return false;
            // Determine it should go before or after this item
            const rect = this.getBoundingClientRect();
            const clientY = e.clientY;
            const threshold = rect.top + (rect.height / 2);
            const isBefore = clientY < threshold;
            removePlaceholders();
            // Add a placeholder before or after this item
            const placeholder = document.createElement('div');
            placeholder.className = 'placeholder';
            if (isBefore) {
                this.parentNode.insertBefore(placeholder, this);
            } else {
                this.parentNode.insertBefore(placeholder, this.nextSibling);
            }
            return false;
        }

        function handleDragLeave(e) {
            this.classList.remove('drag-over');
        }

        function handleDragEnd(e) {
            this.classList.remove('dragging');
            document.querySelectorAll('.category-item').forEach(item => {
                item.classList.remove('drag-over');
            });
            removePlaceholders();
        }
        
        function removePlaceholders() {
            document.querySelectorAll('.placeholder').forEach(placeholder => {
                placeholder.remove();
            });
        }

        function handleDrop(e) {
            e.stopPropagation();
            e.preventDefault();
            removePlaceholders();
            // Don't do anything if dropping on the same item
            if (draggedItem !== this) {
                const rect = this.getBoundingClientRect();
                const clientY = e.clientY;
                const threshold = rect.top + (rect.height / 2);
                const isBefore = clientY < threshold;
                
                const fromIndex = parseInt(draggedItem.dataset.index);
                let toIndex = parseInt(this.dataset.index);
                
                if (!isBefore && fromIndex < toIndex) {
                    toIndex = toIndex; // Insert after
                } else if (isBefore && fromIndex > toIndex) {
                    toIndex = toIndex; // Insert before
                } else if (isBefore && fromIndex < toIndex) {
                    toIndex = toIndex - 1; // Adjust for removal of dragged item
                } else if (!isBefore && fromIndex > toIndex) {
                    toIndex = toIndex + 1; // Insert after, adjust for position
                }
                
                const movedItem = categories[fromIndex];
                categories.splice(fromIndex, 1);
                categories.splice(toIndex, 0, movedItem);
                renderCategories();
            }
            return false;
        }

        function addCategory() {
            const input = document.getElementById('newCategory');
            const category = input.value.trim();
            if (category && !categories.includes(category)) {
                categories.push(category);
                renderCategories();
                input.value = '';
            } else if (categories.includes(category)) {
                showMessage('categoriesMessage', 'Category already exists', false);
            }
        }

        function removeCategory(index) {
            const category = categories[index];
            showDeleteCategoryModal(category);
        }

        function showDeleteCategoryModal(oldCategory) {
            document.getElementById('oldCategoryName').textContent = oldCategory;
            const select = document.getElementById('reassignSelect');
            select.innerHTML = '';
            categories.filter(c => c !== oldCategory).forEach(c => {
                const opt = document.createElement('option');
                opt.value = c;
                opt.textContent = c;
                select.appendChild(opt);
            });
            document.getElementById('deleteCategoryModal').classList.add('active');
            document.getElementById('confirmReassign').onclick = async () => {
                const newCat = select.value;
                if (!newCat) {
                    showMessage('categoriesMessage', 'Please select a category to reassign to', false);
                    return;
                }
                try {
                    const res = await fetch('/categories/delete', {
                        method: 'PUT',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({old: oldCategory, new: newCat})
                    });
                    if (res.ok) {
                        showMessage('categoriesMessage', 'Category reassigned and deleted', true);
                        // Refresh categories UI
                        setTimeout(() => {
                            window.location.reload();
                        }, 600);
                        try { localStorage.setItem('categoriesUpdated', Date.now().toString()); } catch (e) {}
                    } else {
                        showMessage('categoriesMessage', 'Failed to reassign category', false);
                    }
                } catch (err) {
                    console.error('Error reassigning category:', err);
                    showMessage('categoriesMessage', 'Error reassigning category', false);
                }
            };
        }

        function closeDeleteCategoryModal() {
            document.getElementById('deleteCategoryModal').classList.remove('active');
        }

        async function saveCategories() {
            if (categories.length === 0) {
                showMessage('categoriesMessage', 'At least one category is required', false);
                return;
            }
            try {
                const response = await fetch('/categories/edit', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(categories)
                });   
                if (response.ok) {
                    showMessage('categoriesMessage', 'Categories saved successfully', true);
                    try { localStorage.setItem('categoriesUpdated', Date.now().toString()); } catch (e) {}
                } else {
                    showMessage('categoriesMessage', 'Failed to save categories', false);
                }
            } catch (error) {
                console.error('Error saving categories:', error);
                showMessage('categoriesMessage', 'Error saving categories', false);
            }
        }

        // Currency functions
        function populateCurrencySelect() {
            const select = document.getElementById('currencySelect');
            select.innerHTML = '';
            for (const [code, symbol] of Object.entries(currencySymbols)) {
                const option = document.createElement('option');
                option.value = code;
                option.textContent = `${code.toUpperCase()} (${symbol})`;
                if (symbol === currentCurrency) {
                    option.selected = true;
                }
                select.appendChild(option);
            }
        }
        
        async function saveCurrency() {
            const currencyCode = document.getElementById('currencySelect').value;
            try {
                const response = await fetch('/currency', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(currencyCode)
                });
                if (response.ok) {
                    showMessage('currencyMessage', 'Currency saved successfully', true);
                    currentCurrency = currencySymbols[currencyCode];
                } else {
                    showMessage('currencyMessage', 'Failed to save currency', false);
                }
            } catch (error) {
                console.error('Error saving currency:', error);
                showMessage('currencyMessage', 'Error saving currency', false);
            }
        }



        // Initialize the page
        function renderBudgets() {
            const container = document.getElementById('budget-list');
            container.innerHTML = '';
            categories.forEach(cat => {
                const value = budgets[cat] || 0;
                const item = document.createElement('div');
                item.className = 'budget-item';
                item.innerHTML = `
                    <label>${cat}</label>
                    <input type="number" data-category="${cat}" value="${value}" step="0.01" min="0">
                `;
                container.appendChild(item);
            });
        }

        function renderExchangeRates() {
            const container = document.getElementById('exchange-rates-list');
            container.innerHTML = '';
            Object.keys(exchangeRates).sort().forEach(code => {
                const value = exchangeRates[code];
                const item = document.createElement('div');
                item.className = 'exchange-item';
                item.innerHTML = `
                    <label>${code.toUpperCase()}</label>
                    <input type="number" data-code="${code}" value="${value}" step="0.0001" min="0">
                    <button class="delete-button" data-code="${code}"><i class="fa-solid fa-times"></i></button>
                `;
                container.appendChild(item);
                item.querySelector('.delete-button').addEventListener('click', (e) => {
                    const codeToDel = e.target.closest('button').dataset.code;
                    delete exchangeRates[codeToDel];
                    renderExchangeRates();
                });
            });
        }

        async function initialize() {
            try {
                const response = await fetch('/categories');
                if (!response.ok) {
                    throw new Error('Failed to fetch configuration');
                }
                const config = await response.json();
                categories = [...config.categories];
                currentCurrency = config.currency;
                currentStartDate = config.startDate;
                budgets = config.budgets || {};
                exchangeRates = config.exchangeRates || {};
                let currentCurrencyCode = "usd"; // Default
                for (const [code, symbol] of Object.entries(currencySymbols)) {
                    if (symbol === currentCurrency) {
                        currentCurrencyCode = code;
                        break;
                    }
                }
                renderCategories();
                populateCurrencySelect();
                renderBudgets();
                renderExchangeRates();
            } catch (error) {
                console.error('Failed to initialize settings:', error);
                showMessage('categoriesMessage', 'Failed to load settings', false);
            }
        }

        // Import functions
        async function handleFileUpload(e) {
            const fileInput = e.target;
            const file = fileInput.files[0];
            if (!file) return;
            const fileType = fileInput.id === 'csvFile' ? 'csv' : 'json';
            const formData = new FormData();
            formData.append('file', file);

            try {
                // Show loading message
                const importMessageDiv = document.getElementById('importMessage');
                importMessageDiv.textContent = `Uploading ${fileType.toUpperCase()} file...`;
                importMessageDiv.className = 'form-message';
                const response = await fetch(`/import/${fileType}`, {
                    method: 'POST',
                    body: formData
                });
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || `Failed to import ${fileType.toUpperCase()} file`);
                }

                const result = await response.json();
                importMessageDiv.textContent = `Successfully imported ${result.imported} expenses!`;
                importMessageDiv.className = 'form-message success';
                const summaryDiv = document.getElementById('importSummary');
                summaryDiv.style.display = 'block';
                summaryDiv.innerHTML = `
                    <div><strong>Total processed:</strong> ${result.total_processed}</div>
                    <div><strong>Successfully imported:</strong> ${result.imported}</div>
                    <div><strong>Skipped:</strong> ${result.skipped}</div>
                `;

                if (result.new_categories && result.new_categories.length > 0) {
                    summaryDiv.innerHTML += `
                        <div><strong>New categories added (refreshing in ~4 seconds):</strong> ${result.new_categories.join(', ')}</div>
                    `;
                    // Refresh needed to show new categories
                    setTimeout(() => {
                        window.location.reload();
                    }, 4000);
                } else {
                    setTimeout(() => {
                        importMessageDiv.textContent = '';
                        importMessageDiv.className = 'form-message';
                        summaryDiv.style.display = 'none';
                    }, 4000);
                }
                fileInput.value = '';
            } catch (error) {
                console.error(`Error importing ${fileType} file:`, error);
                const importMessageDiv = document.getElementById('importMessage');
                importMessageDiv.textContent = `Error: ${error.message}`;
                importMessageDiv.className = 'form-message error';
                fileInput.value = '';
            }
        }

        // Event listeners
        document.getElementById('addCategory').addEventListener('click', addCategory);
        document.getElementById('saveCategories').addEventListener('click', saveCategories);
        document.getElementById('saveCurrency').addEventListener('click', saveCurrency);

        document.getElementById('saveBudgets').addEventListener('click', async () => {
            // Collect budget map
            const inputs = document.querySelectorAll('#budget-list input[data-category]');
            const payload = {};
            inputs.forEach(inp => {
                const cat = inp.dataset.category;
                const val = parseFloat(inp.value) || 0;
                payload[cat] = val;
            });
            try {
                const res = await fetch('/budgets/edit', {
                    method: 'PUT',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });
                if (res.ok) {
                    showMessage('budgetsMessage', 'Budgets saved successfully', true);
                    try { localStorage.setItem('budgetsUpdated', Date.now().toString()); } catch (e) {}
                } else {
                    showMessage('budgetsMessage', 'Failed to save budgets', false);
                }
            } catch (err) {
                console.error('Error saving budgets:', err);
                showMessage('budgetsMessage', 'Error saving budgets', false);
            }
        });
        document.getElementById('addExchange').addEventListener('click', () => {
            const code = document.getElementById('newExchangeCode').value.trim().toLowerCase();
            const rate = parseFloat(document.getElementById('newExchangeRate').value);
            if (!code || isNaN(rate) || rate <= 0) {
                showMessage('exchangeMessage', 'Invalid code or rate', false);
                return;
            }
            exchangeRates[code] = rate;
            document.getElementById('newExchangeCode').value = '';
            document.getElementById('newExchangeRate').value = '';
            renderExchangeRates();
        });
        document.getElementById('saveExchangeRates').addEventListener('click', async () => {
            try {
                const res = await fetch('/exchangerates/edit', {
                    method: 'PUT',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(exchangeRates)
                });
                if (res.ok) {
                    showMessage('exchangeMessage', 'Exchange rates saved successfully', true);
                } else {
                    showMessage('exchangeMessage', 'Failed to save exchange rates', false);
                }
            } catch (err) {
                console.error('Error saving exchange rates:', err);
                showMessage('exchangeMessage', 'Error saving exchange rates', false);
            }
        });
        document.getElementById('csvFile').addEventListener('change', handleFileUpload);
        document.getElementById('jsonFile').addEventListener('change', handleFileUpload);
        document.getElementById('newCategory').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                addCategory();
            }
        });

        // Initialize on load
        document.addEventListener('DOMContentLoaded', initialize);
        window.removeCategory = removeCategory;
    </script>
</body>
</html>
