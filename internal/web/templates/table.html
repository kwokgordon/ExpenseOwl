<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/fa.min.css">
    <link rel="stylesheet" href="/style.css">
    <script src="/components/header.js" type="text/javascript" defer></script>

    <title>ExpenseOwl Table</title>
</head>
<body>
    <div class="container">
            <div class="nav-bar">
                <a href="/">
                    <img src="/pwa/icon-512.png" alt="ExpenseOwl Logo" height="85" style="vertical-align: middle; margin-right: 20px;">
                </a>
                <a href="/" class="view-button" data-tooltip="Dashboard">
                    <i class="fa-solid fa-chart-pie"></i>
                </a>
                <a href="/table" class="view-button active" data-tooltip="Table View">
                    <i class="fa-solid fa-table"></i>
                </a>
                <a href="/settings" class="view-button" data-tooltip="Settings">
                    <i class="fa-solid fa-gear"></i>
                </a>
            </div>




        <!-- Sort & Filter controls (below form, above table) -->
        <div class="table-controls" style="display:flex;gap:1rem;align-items:center;margin:1rem 0;">
            <label>Sort:
                <select id="sortSelect">
                    <option value="dateDesc">Date (newest)</option>
                    <option value="dateAsc">Date (oldest)</option>
                    <option value="categoryAsc">Category A-Z</option>
                    <option value="categoryDesc">Category Z-A</option>
                </select>
            </label>
            <label>Filter:
                <select id="filterCategory"><option value="">All</option></select>
            </label>
            <div style="flex:1"></div>
            <button id="newExpense" class="nav-button">New Expense</button>
        </div>

        <div id="tableContainer">
            <!-- Table will be populated by JavaScript -->
        </div>
    </div>

    <div id="deleteModal" class="modal">
        <div class="modal-content">
            <h3>Delete Expense</h3>
            <p>Are you sure you want to delete this expense? (cannot be undone)</p>
            <div class="modal-buttons">
                <button class="modal-button" onclick="closeDeleteModal()">Cancel</button>
                <button class="modal-button confirm" onclick="confirmDelete()">Delete</button>
            </div>
        </div>
    </div>

    <!-- Expense Modal (create/edit) -->
    <div id="expenseModal" class="modal">
        <div class="modal-content">
            <h3 id="expenseModalTitle">Add Expense</h3>
            <form id="expenseForm" class="expense-form">
                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" required>
                </div>
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" placeholder="e.g., Taxi, Dinner" required>
                </div>
                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" required>
                        <option value="">categories</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="currency">Currency</label>
                    <select id="currency">
                        <option value="">-- choose --</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="currencyAmount">Currency Amount</label>
                    <input type="number" id="currencyAmount" step="0.01" min="0">
                </div>
                <div class="form-group">
                    <label for="amount">Amount (CAD)</label>
                    <input type="number" id="amount" step="0.01" min="0">
                    <div class="form-note">Automatically calculated from Currency unless you manually override</div>
                </div>
                <div style="display:flex;gap:0.5rem;justify-content:flex-end;margin-top:1rem;">
                    <button type="button" class="modal-button" onclick="closeExpenseModal()">Cancel</button>
                    <button type="submit" class="modal-button nav-button" id="expenseSubmit">Add Expense</button>
                </div>
                <div id="formMessage" class="form-message"></div>
            </form>
        </div>
    </div>

    <script>
        let currencySymbol = '$'; // Default to USD
        let currentDate = new Date();
        let allExpenses = [];
        let startDate = 1;
        // When true, user manually overrode the Amount input and auto-calculation should not overwrite it
        let amountOverride = false;

        function formatCurrency(amount) {
            let formattedAmount = new Intl.NumberFormat('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2}).format(amount);
            // Currencies commonly used after the amount
            const postfixCurrencies = new Set(['kr', 'kr.', 'Fr', 'zł']);
            if (postfixCurrencies.has(currencySymbol)) {
                return `${formattedAmount} ${currencySymbol}`;
            }
            return `${currencySymbol} ${formattedAmount}`;
        }

        function formatMonth(date) {
            return date.toLocaleDateString('en-US', { 
                year: 'numeric',
                month: 'long',
                timeZone: getUserTimeZone()
            });
        }
        function getISODateWithLocalTime(dateInput) {
            const [year, month, day] = dateInput.split('-').map(Number);
            const now = new Date();
            const hours = now.getHours();
            const minutes = now.getMinutes();
            const seconds = now.getSeconds();
            const localDateTime = new Date(year, month - 1, day, hours, minutes, seconds);
            return localDateTime.toISOString();
        }
        function getUserTimeZone() {
            return Intl.DateTimeFormat().resolvedOptions().timeZone;
        }
        function formatDateFromUTC(utcDateString) {
            const date = new Date(utcDateString);
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function updateMonthDisplay() {
            document.getElementById('currentMonth').textContent = formatMonth(currentDate);
            const now = new Date();
            const isCurrentMonth = currentDate.getMonth() === now.getMonth() && currentDate.getFullYear() === now.getFullYear();
            document.getElementById('nextMonth').disabled = isCurrentMonth;
        }
        function getMonthBounds(date) {
            const localDate = new Date(date);
            // If startDate is 1, return generic month bounds
            if (startDate === 1) {
                const startLocal = new Date(localDate.getFullYear(), localDate.getMonth(), 1);
                const endLocal = new Date(localDate.getFullYear(), localDate.getMonth() + 1, 0, 23, 59, 59, 999);
                const start = new Date(startLocal.toISOString());
                const end = new Date(endLocal.toISOString());
                return { start, end };
            }
            // If startDate is not 1, need to account for variations in month length
            let thisMonthStartDate = startDate;
            let prevMonthStartDate = startDate;
            let nextMonthStartDate = startDate;
            // Adjust for variations in current, previous and next months
            const currentMonth = localDate.getMonth();
            const currentYear = localDate.getFullYear();
            const daysInCurrentMonth = new Date(currentYear, currentMonth + 1, 0).getDate(); // last day of current month
            thisMonthStartDate = Math.min(thisMonthStartDate, daysInCurrentMonth);
            const prevMonth = currentMonth === 0 ? 11 : currentMonth - 1;
            const prevYear = currentMonth === 0 ? currentYear - 1 : currentYear;
            const daysInPrevMonth = new Date(prevYear, prevMonth + 1, 0).getDate();
            prevMonthStartDate = Math.min(prevMonthStartDate, daysInPrevMonth);
            const nextMonth = currentMonth === 11 ? 0 : currentMonth + 1;
            const nextYear = currentMonth === 11 ? currentYear + 1 : currentYear;
            const daysInNextMonth = new Date(nextYear, nextMonth + 1, 0).getDate();
            nextMonthStartDate = Math.min(nextMonthStartDate, daysInNextMonth);
            
            // Return bounds for current period or the previous period
            if (localDate.getDate() < thisMonthStartDate) {
                const startLocal = new Date(prevYear, prevMonth, prevMonthStartDate);
                const endLocal = new Date(currentYear, currentMonth, thisMonthStartDate - 1, 23, 59, 59, 999);
                const start = new Date(startLocal.toISOString());
                const end = new Date(endLocal.toISOString());
                return { start, end };
            } else {
                const startLocal = new Date(currentYear, currentMonth, thisMonthStartDate);
                const endLocal = new Date(nextYear, nextMonth, nextMonthStartDate - 1, 23, 59, 59, 999);
                const start = new Date(startLocal.toISOString());
                const end = new Date(endLocal.toISOString());
                return { start, end };
            }
        }
        function getMonthExpenses(expenses) {
            const { start, end } = getMonthBounds(currentDate);
            return expenses.filter(exp => {
                const expDate = new Date(exp.date);
                return expDate >= start && expDate <= end;
            }).sort((a, b) => new Date(b.date) - new Date(a.date));
        }

        function createTable(expenses) {
            if (expenses.length === 0) {
                return `<div class="no-data">No expenses recorded for this month</div>`;
            }
            return `
                <table class="expense-table">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Category</th>
                            <th>Amount</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody>
                        ${expenses.map(expense => `
                            <tr>
                                <td>
                                    <div><strong>${expense.name}</strong>
                                        <div class="date-inline">${formatDateFromUTC(expense.date)}</div>
                                    </div>
                                </td>
                                <td>${expense.category}</td>
                                <td class="amount">${expense.currency ? (expense.currencyAmount + ' ' + expense.currency.toUpperCase() + ' / ') : ''}${formatCurrency(expense.amount)}</td>
                                <td>
                                    <button class="delete-button" onclick="editExpense('${expense.id}', '${expense.name}', '${expense.category}', ${expense.amount}, '${expense.date}', '${expense.currency || ''}', ${expense.currencyAmount || 0})">
                                        <i class="fa-solid fa-pen-to-square"></i>
                                    </button>
                                    <button class="delete-button" onclick="showDeleteModal('${expense.id}')">
                                        <i class="fa-solid fa-trash-can"></i>
                                    </button>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }

        function applyTableFilterSort(items) {
            let results = items.slice();
            const filter = document.getElementById('filterCategory').value;
            if (filter) {
                results = results.filter(exp => exp.category === filter);
            }
            const sorter = document.getElementById('sortSelect').value;
            switch (sorter) {
                case 'dateAsc':
                    results.sort((a,b) => new Date(a.date) - new Date(b.date));
                    break;
                case 'dateDesc':
                    results.sort((a,b) => new Date(b.date) - new Date(a.date));
                    break;
                case 'categoryAsc':
                    results.sort((a,b) => (a.category || '').localeCompare(b.category || ''));
                    break;
                case 'categoryDesc':
                    results.sort((a,b) => (b.category || '').localeCompare(a.category || ''));
                    break;
            }
            return results;
        }

        function updateTable() {
            let monthExpenses = getMonthExpenses(allExpenses);
            monthExpenses = applyTableFilterSort(monthExpenses);
            const tableContainer = document.getElementById('tableContainer');
            tableContainer.innerHTML = createTable(monthExpenses);
        }

        function editExpense(id, name, category, amount, date, currency, currencyAmount) {
            // ensure selects are populated
            populateCurrencySelect();
            const categorySelect = document.getElementById('category');
            if (window.config && window.config.categories && categorySelect) {
                categorySelect.innerHTML = window.config.categories.map(cat => `<option value="${cat}">${cat}</option>`).join('');
                // Set to last used category if available
                const lastCat = localStorage.getItem('lastCategory');
                if (lastCat && window.config.categories.includes(lastCat)) {
                    categorySelect.value = lastCat;
                } else if (window.config.categories.length > 0) {
                    categorySelect.value = window.config.categories[0];
                }
            }
            document.getElementById('name').value = name;
            document.getElementById('category').value = category;
            document.getElementById('currency').value = currency || '';
            document.getElementById('currencyAmount').value = currencyAmount || '';
            // Determine if amount was manually overridden or matches computed value
            const cAmt = parseFloat(currencyAmount) || 0;
            const amt = parseFloat(amount) || 0;
            let computed = null;
            if (currency && cAmt > 0 && window.config && window.config.exchangeRates && window.config.exchangeRates[currency]) {
                const rate = window.config.exchangeRates[currency];
                computed = cAmt * rate;
            }
            if (computed !== null && Math.abs(amt - computed) < 0.005) {
                amountOverride = false;
                document.getElementById('amount').value = computed.toFixed(2);
            } else {
                amountOverride = true;
                document.getElementById('amount').value = (amt).toFixed ? (amt).toFixed(2) : (parseFloat(amt)||0).toFixed(2);
            }
            const localDate = new Date(date);
            const year = localDate.getFullYear();
            const month = String(localDate.getMonth() + 1).padStart(2, '0');
            const day = String(localDate.getDate()).padStart(2, '0');
            document.getElementById('date').value = `${year}-${month}-${day}`;
            const form = document.getElementById('expenseForm');
            form.dataset.editId = id;
            const submitButton = document.getElementById('expenseSubmit');
            submitButton.textContent = 'Update Expense';
            document.getElementById('expenseModalTitle').textContent = 'Edit Expense';
            // Open modal
            document.getElementById('expenseModal').classList.add('active');
        }

        async function initialize() {
            try {
                // Fetch config response
                const configResponse = await fetch('/categories');
                if (!configResponse.ok) throw new Error('Failed to fetch configuration');
                const config = await configResponse.json();
                const categorySelect = document.getElementById('category');
                categorySelect.innerHTML = config.categories.map(cat => 
                    `<option value="${cat}">${cat}</option>`
                ).join('');
                // Set to last used category if available
                const lastCat = localStorage.getItem('lastCategory');
                if (lastCat && config.categories.includes(lastCat)) {
                    categorySelect.value = lastCat;
                } else if (config.categories.length > 0) {
                    categorySelect.value = config.categories[0];
                }
                // populate filter control
                const filterSelect = document.getElementById('filterCategory');
                if (filterSelect) {
                    filterSelect.innerHTML = '<option value="">All</option>' + config.categories.map(cat => `<option value="${cat}">${cat}</option>`).join('');
                    // If a category is specified in URL params, pre-select it
                    const params = new URLSearchParams(window.location.search);
                    const catParam = params.get('category');
                    if (catParam) {
                        const options = Array.from(filterSelect.options).map(o => o.value);
                        if (options.includes(catParam)) {
                            filterSelect.value = catParam;
                            try { localStorage.setItem('lastCategory', catParam); } catch(e) {}
                        }
                    }
                }
                currencySymbol = config.currency;
                startDate = config.startDate;
                // store global config for helper functions
                window.config = config;
                // populate currency select used in modal
                populateCurrencySelect();
                const response = await fetch('/expenses');
                if (!response.ok) throw new Error('Failed to fetch data');
                allExpenses = await response.json();
                updateTable();
            } catch (error) {
                console.error('Failed to initialize table:', error);
                document.getElementById('tableContainer').innerHTML = 
                    '<div class="no-data">Failed to load expenses</div>';
            }
        }

        // Sorting and filtering controls
        document.getElementById('sortSelect').addEventListener('change', updateTable);
        document.getElementById('filterCategory').addEventListener('change', updateTable);
        // currency helper
        function populateCurrencySelect() {
            const sel = document.getElementById('currency');
            if (!sel) return;
            sel.innerHTML = '<option value="">-- choose --</option>';
            const codes = Object.keys((window.config && window.config.exchangeRates) || {});
            codes.forEach(code => {
                const opt = document.createElement('option');
                opt.value = code;
                opt.textContent = code.toUpperCase();
                sel.appendChild(opt);
            });
            const last = localStorage.getItem('lastCurrency');
            if (last && codes.includes(last)) sel.value = last;
        }
        
        // Listen for category updates from settings
        window.addEventListener('storage', (e) => {
            if (e.key === 'categoriesUpdated') {
                fetch('/categories').then(r => r.json()).then(cfg => {
                    const filter = document.getElementById('filterCategory');
                    filter.innerHTML = '<option value="">All</option>' + cfg.categories.map(c => `<option value="${c}">${c}</option>`).join('');
                    // repopulate category and currency selects
                    const categorySelect = document.getElementById('category');
                    if (categorySelect) categorySelect.innerHTML = cfg.categories.map(cat => `<option value="${cat}">${cat}</option>`).join('');
                    window.config = cfg;
                    populateCurrencySelect();
                }).catch(err => console.error('Failed to refresh categories in table:', err));
            }
        });

        function maybeComputeAmount() {
            if (amountOverride) return;
            const code = document.getElementById('currency').value;
            const cAmt = parseFloat(document.getElementById('currencyAmount').value) || 0;
            if (code && cAmt > 0 && window.config && window.config.exchangeRates && window.config.exchangeRates[code]) {
                const rate = window.config.exchangeRates[code];
                document.getElementById('amount').value = (cAmt * rate).toFixed(2);
            } else {
                document.getElementById('amount').value = '';
            }
        }

        // Wire up modal inputs for live calculation and manual override
        const currencySel = document.getElementById('currency');
        const currencyAmtInput = document.getElementById('currencyAmount');
        const amountInput = document.getElementById('amount');
        if (currencySel) currencySel.addEventListener('change', (e) => { amountOverride = false; maybeComputeAmount(); });
        if (currencyAmtInput) currencyAmtInput.addEventListener('input', (e) => { amountOverride = false; maybeComputeAmount(); });
        if (amountInput) {
            amountInput.addEventListener('input', (e) => {
                const v = e.target.value;
                if (v === '' || v === null) {
                    amountOverride = false;
                    maybeComputeAmount();
                } else {
                    amountOverride = true;
                }
            });
        }

        let expenseToDelete = null;

        function showDeleteModal(id) {
            expenseToDelete = id;
            document.getElementById('deleteModal').classList.add('active');
        }

        function closeDeleteModal() {
            expenseToDelete = null;
            document.getElementById('deleteModal').classList.remove('active');
        }

        async function confirmDelete() {
            if (!expenseToDelete) return;
            try {
                const response = await fetch(`/expense/delete?id=${expenseToDelete}`, {
                    method: 'DELETE'
                });
                if (!response.ok) {
                    throw new Error('Failed to delete expense');
                }
                // Refresh the expenses data
                await initialize();
                closeDeleteModal();
            } catch (error) {
                console.error('Error deleting expense:', error);
                alert('Failed to delete expense. Please try again.');
            }
        }

        document.getElementById('deleteModal').addEventListener('click', (e) => {
            if (e.target.className === 'modal active') {
                closeDeleteModal();
            }
        });

        // Expense modal helpers
        function showExpenseModal() {
            const form = document.getElementById('expenseForm');
            form.reset();
            delete form.dataset.editId;
            document.getElementById('expenseSubmit').textContent = 'Add Expense';
            document.getElementById('expenseModalTitle').textContent = 'Add Expense';
            // set date to today
            const today = new Date();
            const year = today.getFullYear();
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const day = String(today.getDate()).padStart(2, '0');
            document.getElementById('date').value = `${year}-${month}-${day}`;
            // ensure selects are populated
            populateCurrencySelect();
            const categorySelect = document.getElementById('category');
            if (window.config && window.config.categories && categorySelect) {
                categorySelect.innerHTML = window.config.categories.map(cat => `<option value="${cat}">${cat}</option>`).join('');
                // Set to last used category if available
                const lastCat = localStorage.getItem('lastCategory');
                if (lastCat && window.config.categories.includes(lastCat)) {
                    categorySelect.value = lastCat;
                } else if (window.config.categories.length > 0) {
                    categorySelect.value = window.config.categories[0];
                }
            }
            amountOverride = false;
            // compute initial amount if possible
            maybeComputeAmount();
            document.getElementById('expenseModal').classList.add('active');
        }

        function closeExpenseModal() {
            document.getElementById('expenseModal').classList.remove('active');
        }

        document.getElementById('expenseModal').addEventListener('click', (e) => {
            if (e.target.className === 'modal active') {
                closeExpenseModal();
            }
        });

        document.getElementById('newExpense').addEventListener('click', () => {
            showExpenseModal();
        });

        document.getElementById('expenseForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const form = e.target;
            const editId = form.dataset.editId;
            const formData = {
                name: document.getElementById('name').value,
                category: document.getElementById('category').value,
                amount: Math.round((parseFloat(document.getElementById('amount').value) || 0) * 100) / 100,
                currency: document.getElementById('currency').value.trim().toLowerCase(),
                currencyAmount: parseFloat(document.getElementById('currencyAmount').value) || 0,
                date: getISODateWithLocalTime(document.getElementById('date').value)
            };
            try {
                const url = editId ? `/expense/edit?id=${editId}` : '/expense';
                const response = await fetch(url, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData)
                });
                const messageDiv = document.getElementById('formMessage');
                if (response.ok) {
                    messageDiv.textContent = editId ? 'Expense updated successfully!' : 'Expense added successfully!';
                    messageDiv.className = 'form-message success';
                    // persist last-used currency for next time
                    try { localStorage.setItem('lastCurrency', formData.currency || ''); } catch (e) {}
                    form.reset();
                    delete form.dataset.editId;
                    document.getElementById('expenseSubmit').textContent = 'Add Expense';
                    closeExpenseModal();
                    await initialize();
                } else {
                    const error = await response.json();
                    messageDiv.textContent = `Error: ${error.error || 'Failed to save expense'}`;
                    messageDiv.className = 'form-message error';
                }
                // Clear message after 3 seconds
                setTimeout(() => {
                    messageDiv.textContent = '';
                    messageDiv.className = 'form-message';
                }, 3000);
            } catch (error) {
                console.error('Error saving expense:', error);
                const messageDiv = document.getElementById('formMessage');
                messageDiv.textContent = 'Error: Failed to save expense';
                messageDiv.className = 'form-message error';
            }
        });
        document.addEventListener('DOMContentLoaded', initialize);
    </script>
</body>
</html>
